<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secondary Science Leaders' Meeting — Helpdesk</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --surface: #ffffff;
    --ink: #1a1a2e;
    --ink-muted: #6b6b80;
    --accent: #1a5c96;
    --accent-light: #e8f0f9;
    --accent-hover: #134a7a;
    --green: #1a7a4a;
    --green-light: #e8f5ed;
    --red: #b83232;
    --red-light: #fdf0f0;
    --amber: #8a6200;
    --amber-light: #fdf6e3;
    --border: #ddd8d0;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(26,26,46,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .page-header .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .page-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .page-header p {
    font-size: 15px;
    color: var(--ink-muted);
    font-weight: 300;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    max-width: 620px;
    margin: 0 auto 24px;
    border: 1px solid var(--border);
  }

  /* Status Panel */
  .status-panel {
    max-width: 620px;
    margin: 0 auto 24px;
  }

  .status-panel details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .status-panel summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    list-style: none;
    user-select: none;
  }

  .status-panel summary::-webkit-details-marker { display: none; }
  .status-panel summary::after {
    content: '▾';
    margin-left: auto;
    font-size: 11px;
  }
  .status-panel details[open] summary::after { content: '▴'; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.ok { background: var(--green); }
  .status-dot.error { background: var(--red); }

  .status-body {
    padding: 0 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--bg);
  }

  .status-row .label { color: var(--ink-muted); flex: 1; }
  .status-row .count { font-weight: 600; color: var(--ink); }
  .status-row .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .badge-ok { background: var(--green-light); color: var(--green); }
  .badge-loading { background: var(--amber-light); color: var(--amber); }
  .badge-error { background: var(--red-light); color: var(--red); }

  /* Search */
  .search-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  .search-wrapper {
    position: relative;
  }

  .search-wrapper svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }

  #nameInput {
    width: 100%;
    padding: 14px 14px 14px 44px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  #nameInput:focus { border-color: var(--accent); background: #fff; }

  #dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(26,26,46,0.12);
    max-height: 220px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }

  #dropdown.visible { display: block; }

  .dropdown-item {
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--bg);
    transition: background 0.1s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover, .dropdown-item.active { background: var(--accent-light); }
  .dropdown-item .name { font-weight: 500; }
  .dropdown-item .school { font-size: 12px; color: var(--ink-muted); }

  .dropdown-empty {
    padding: 16px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  /* Result Card */
  #resultCard {
    display: none;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .result-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.2;
  }

  .result-school {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .info-grid {
    display: grid;
    gap: 12px;
  }

  .info-item {
    background: var(--bg);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .info-item .info-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .info-item .info-value {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  .day-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 99px;
    width: fit-content;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    margin-top: 6px;
    width: 100%;
    justify-content: center;
  }

  .link-btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
  }

  .link-btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,92,150,0.25); }

  .link-btn-secondary {
    background: var(--surface);
    color: var(--accent);
    border: 2px solid var(--accent-light);
  }

  .link-btn-secondary:hover { background: var(--accent-light); }

  .sessions-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr 1fr;
  }

  @media (max-width: 480px) { .sessions-grid { grid-template-columns: 1fr; } }

  .session-card {
    background: var(--bg);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .session-type-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .session-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.35;
  }

  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 40px;
  }

  .loading-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="page-header">
  <img src="banner.png" alt="Banner" style="display: block; max-width: 620px; width: 100%; margin: 20px auto 0; border-radius: 12px;">
  <p>Self-Service Helpdesk &mdash; Enter your name to retrieve your session details</p>
</header>

<!-- Search Card -->
<div class="card">
  <label class="search-label" for="nameInput">Your Name</label>
  <div class="search-wrapper">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="nameInput" placeholder="Start typing your name…" autocomplete="off" />
    <div id="dropdown"></div>
  </div>
</div>

<!-- Result Card -->
<div class="card" id="resultCard">
  <div class="result-header">
    <div class="avatar" id="avatarInitial">?</div>
    <div>
      <div class="result-name" id="resultName">—</div>
      <div class="result-school" id="resultSchool">—</div>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <span class="info-label">Registered Day</span>
      <span class="info-value">
        <span class="day-badge" id="resultDay">—</span>
      </span>
    </div>

    <div class="sessions-grid">
      <div class="session-card">
        <span class="session-type-label">Main Session</span>
        <span class="session-title" id="mainTitle">—</span>
        <a href="#" class="link-btn link-btn-primary" id="mainLink" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 10l5-5m0 0h-4m4 0v4M9 15l-5 5m0 0h4m-4 0v-4"/></svg>
          Join Main Session
        </a>
      </div>
      <div class="session-card">
        <span class="session-type-label">Breakout Session</span>
        <span class="session-title" id="breakoutTitle">—</span>
        <a href="#" class="link-btn link-btn-secondary" id="breakoutLink" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 10l5-5m0 0h-4m4 0v4M9 15l-5 5m0 0h4m-4 0v-4"/></svg>
          Join Breakout
        </a>
      </div>
    </div>
  </div>
</div>

<div class="status-panel">
  <details>
    <summary>
      <span class="status-dot" id="globalDot"></span>
      <span id="globalStatus">Checking data connection…</span>
    </summary>
    <div class="status-body">
      <div class="status-row">
        <span class="label">Participant list</span>
        <span class="count" id="participantCount">—</span>
        <span class="badge badge-loading" id="participantBadge">Loading</span>
      </div>
      <div class="status-row">
        <span class="label">Session list</span>
        <span class="count" id="sessionCount">—</span>
        <span class="badge badge-loading" id="sessionBadge">Loading</span>
      </div>
    </div>
  </details>
</div>

<footer class="footer"> </footer>

<script>
// ─────────────────────────────────────────────
// CONFIGURATION — replace with your Sheet IDs
// ─────────────────────────────────────────────
const SHEET_ID = "17sbY-ZUker75RmbNzbPCMT9Wp9ieMP5tFfSVAtZZeWw";

const PARTICIPANTS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Participants`;
const SESSIONS_URL     = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sessions`;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let participants = [];   // { name, school, day, breakoutTitle }
let sessions = [];       // { day, type, title, url }

// ─────────────────────────────────────────────
// CSV PARSER (handles quoted fields with commas)
// ─────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = parseCSVRow(lines[0]).map(h => h.trim().toLowerCase());
  return lines.slice(1).map(line => {
    const vals = parseCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || "").trim());
    return obj;
  }).filter(row => Object.values(row).some(v => v));
}

function parseCSVRow(line) {
  const result = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (c === ',' && !inQuote) {
      result.push(cur); cur = "";
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

// ─────────────────────────────────────────────
// DATA LOADING
// ─────────────────────────────────────────────
function setStatus(elId, badgeId, dotClass, badgeClass, badgeText, count) {
  document.getElementById(elId).textContent = count !== null ? `${count} rows` : "—";
  const badge = document.getElementById(badgeId);
  badge.textContent = badgeText;
  badge.className = `badge ${badgeClass}`;
}

async function loadData() {
  let pOk = false, sOk = false;

  // Load Participants
  try {
    const res = await fetch(PARTICIPANTS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    participants = parseCSV(text);
    setStatus("participantCount", "participantBadge", "ok", "badge-ok", `✓ Loaded`, participants.length);
    pOk = true;
  } catch (e) {
    setStatus("participantCount", "participantBadge", "error", "badge-error", "Error", null);
    console.error("Participants fetch error:", e);
  }

  // Load Sessions
  try {
    const res = await fetch(SESSIONS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    sessions = parseCSV(text);
    setStatus("sessionCount", "sessionBadge", "ok", "badge-ok", `✓ Loaded`, sessions.length);
    sOk = true;
  } catch (e) {
    setStatus("sessionCount", "sessionBadge", "error", "badge-error", "Error", null);
    console.error("Sessions fetch error:", e);
  }

  // Global status dot
  const dot = document.getElementById("globalDot");
  const label = document.getElementById("globalStatus");
  if (pOk && sOk) {
    dot.className = "status-dot ok";
    label.textContent = `Data loaded — ${participants.length} participants, ${sessions.length} sessions`;
  } else {
    dot.className = "status-dot error";
    label.textContent = "Data load error — expand for details";
  }
}

// ─────────────────────────────────────────────
// FUZZY SEARCH
// ─────────────────────────────────────────────
function fuzzyMatch(query, name) {
  query = query.toLowerCase();
  name = name.toLowerCase();
  if (name.includes(query)) return true;
  // simple initials-style match: all query chars appear in order
  let qi = 0;
  for (let i = 0; i < name.length && qi < query.length; i++) {
    if (name[i] === query[qi]) qi++;
  }
  return qi === query.length;
}

// ─────────────────────────────────────────────
// DROPDOWN
// ─────────────────────────────────────────────
const nameInput = document.getElementById("nameInput");
const dropdown  = document.getElementById("dropdown");
let activeIdx = -1;

nameInput.addEventListener("input", () => {
  const q = nameInput.value.trim();
  activeIdx = -1;
  if (q.length < 2) { dropdown.classList.remove("visible"); return; }

  const matches = participants.filter(p => fuzzyMatch(q, p.name)).slice(0, 8);
  if (matches.length === 0) {
    dropdown.innerHTML = `<div class="dropdown-empty">No matches found</div>`;
  } else {
    dropdown.innerHTML = matches.map((p, i) =>
      `<div class="dropdown-item" data-idx="${i}" data-name="${p.name}">
        <span class="name">${p.name}</span>
        <span class="school">${p.school}</span>
      </div>`
    ).join("");
    dropdown.querySelectorAll(".dropdown-item").forEach(el => {
      el.addEventListener("mousedown", () => selectParticipant(matches[+el.dataset.idx]));
    });
  }
  dropdown.classList.add("visible");
  // store for keyboard nav
  dropdown._matches = matches;
});

nameInput.addEventListener("keydown", e => {
  const items = dropdown.querySelectorAll(".dropdown-item");
  if (!items.length) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
  } else if (e.key === "Enter" && activeIdx >= 0) {
    e.preventDefault();
    selectParticipant(dropdown._matches[activeIdx]);
    return;
  } else return;
  items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrapper")) dropdown.classList.remove("visible");
});

// ─────────────────────────────────────────────
// RESULT DISPLAY
// ─────────────────────────────────────────────
function selectParticipant(p) {
  dropdown.classList.remove("visible");
  nameInput.value = p.name;

  // Find main session for this day
  const main = sessions.find(s =>
    String(s.day).trim() === String(p.day).trim() &&
    s.type.toLowerCase().trim() === "main"
  );

  // Find breakout session matching the participant's chosen breakout title
  const breakout = sessions.find(s =>
    String(s.day).trim() === String(p.day).trim() &&
    s.title.trim().toLowerCase() === p.breakouttitle.trim().toLowerCase()
  );

  document.getElementById("avatarInitial").textContent = p.name.charAt(0).toUpperCase();
  document.getElementById("resultName").textContent    = p.name;
  document.getElementById("resultSchool").textContent  = p.school;
  document.getElementById("resultDay").textContent     = p.day;

  document.getElementById("mainTitle").textContent     = main     ? main.title     : "Not found";
  document.getElementById("breakoutTitle").textContent = breakout ? breakout.title : p.breakouttitle || "Not found";

  const mainLink = document.getElementById("mainLink");
  if (main && main.url) {
    mainLink.href = main.url;
    mainLink.style.opacity = "1";
    mainLink.style.pointerEvents = "auto";
  } else {
    mainLink.href = "#";
    mainLink.style.opacity = "0.4";
    mainLink.style.pointerEvents = "none";
  }

  const breakoutLink = document.getElementById("breakoutLink");
  if (breakout && breakout.url) {
    breakoutLink.href = breakout.url;
    breakoutLink.style.opacity = "1";
    breakoutLink.style.pointerEvents = "auto";
  } else {
    breakoutLink.href = "#";
    breakoutLink.style.opacity = "0.4";
    breakoutLink.style.pointerEvents = "none";
  }

  document.getElementById("resultCard").style.display = "block";
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
loadData();
</script>
</body>
</html>
